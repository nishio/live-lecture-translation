<section class="demo-toolbar" aria-label="保存記録の再生">
  <div class="demo-controls">
    <button id="demo-play" type="button" aria-pressed="false" disabled>▶ 再生</button>
    <button id="demo-restart" type="button" disabled>最初から</button>
    <output id="demo-position" aria-live="off">0:00</output>
    <input id="demo-slider" type="range" min="0" max="1" step="any" value="0" aria-label="再生位置" disabled>
  </div>
  <audio id="demo-audio" preload="metadata" hidden></audio>
  <p id="demo-error" role="alert" hidden></p>
</section>
